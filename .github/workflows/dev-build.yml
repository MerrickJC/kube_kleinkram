name: Docker Image CI (GrandTour Datasets)

on:
    push:
        branches: ['dev']

permissions:
    id-token: write # required so the workflow can request an OIDC token for the registry
    contents: read

jobs:
    dev-build:
        environment: 'BuildEnv'
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Get OIDC token for the registry
              id: oidc
              uses: actions/github-script@v7
              with:
                  script: |
                      const token = await core.getIDToken('zot')
                      core.setOutput('token', token)

            - name: Login to registry
              run: echo "${{ steps.oidc.outputs.token }}" | docker login registry.merrickcampbell.au -u oidc --password-stdin
            - name: Read app version
              id: version
              run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
            - working-directory: .
              name: Build the Docker compose
              run: docker compose -f docker-compose.dev.yml build
              env:
                  BACKEND_URL: ${{ vars.BACKEND_URL_DEV }}
                  GIT_BRANCH: ${{ github.ref_name }}
                  GIT_COMMIT: ${{ github.sha }}
                  S3_ENDPOINT: ${{ vars.S3_ENDPOINT_DEV }}
            - name: Tag images with traceable dev version
              run: |
                  for service in api-server frontend queue-consumer docs; do
                    docker tag "registry.merrickcampbell.au/kleinkram:${service}-dev" "registry.merrickcampbell.au/kleinkram:${service}-${{ steps.version.outputs.version }}-dev.${{ github.sha }}"
                  done
            - working-directory: .
              name: push the docker images
              run: |
                  docker compose -f docker-compose.dev.yml push api-server frontend queue-consumer documentation
                  for service in api-server frontend queue-consumer docs; do
                    docker push "registry.merrickcampbell.au/kleinkram:${service}-${{ steps.version.outputs.version }}-dev.${{ github.sha }}"
                  done
