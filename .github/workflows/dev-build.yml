name: Docker Image CI (GrandTour Datasets)

on:
    push:
        branches: ['dev']

jobs:
    dev-build:
        environment: 'BuildEnv'
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Free disk space on runner
              uses: jlumbroso/free-disk-space@v1.3.1
              with:
                  tool-cache: true
                  docker-images: false

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Expose GitHub Actions cache variables
              uses: crazy-max/ghaction-github-runtime@v3

            - name: Login to registry
              run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login registry.direct.merrickcampbell.au -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin
            - name: Read app version
              id: version
              run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
            - working-directory: .
              name: Build the Docker compose images
              run: docker compose -f docker-compose.dev.yml build api-server frontend queue-consumer documentation migrator db-dumper
              env:
                  GIT_BRANCH: ${{ github.ref_name }}
                  GIT_COMMIT: ${{ github.sha }}
                  BUILDX_NO_DEFAULT_ATTESTATIONS: 1
                  COMPOSE_BAKE: 'true'
            - name: Tag images with traceable dev version
              run: |
                  for service in api-server frontend queue-consumer docs migrator db-dumper; do
                    docker tag "registry.direct.merrickcampbell.au/kleinkram:${service}-dev" "registry.direct.merrickcampbell.au/kleinkram:${service}-${{ steps.version.outputs.version }}-dev.${{ github.sha }}"
                  done
            - working-directory: .
              name: push the docker images
              run: |
                  for service in api-server frontend queue-consumer docs migrator db-dumper; do
                    docker push "registry.direct.merrickcampbell.au/kleinkram:${service}-dev"
                    docker push "registry.direct.merrickcampbell.au/kleinkram:${service}-${{ steps.version.outputs.version }}-dev.${{ github.sha }}"
                  done
