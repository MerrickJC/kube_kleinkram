name: Docker Image CI (GrandTour Datasets)

on:
    push:
        branches: ['dev']

jobs:
    dev-build:
        environment: 'BuildEnv'
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - name: Login to DockerHub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Read app version
              id: version
              run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
            - working-directory: .
              name: Build the Docker compose
              run: docker compose -f docker-compose.dev.yml build
              env:
                  BACKEND_URL: ${{ vars.BACKEND_URL_DEV }}
                  GIT_BRANCH: ${{ github.ref_name }}
                  GIT_COMMIT: ${{ github.sha }}
                  S3_ENDPOINT: ${{ vars.S3_ENDPOINT_DEV }}
            - name: Tag images with traceable dev version
              run: |
                  for service in api-server frontend queue-consumer documentation; do
                    docker tag "rslethz/kleinkram:${service}-dev" "rslethz/kleinkram:${service}-${{ steps.version.outputs.version }}-dev.${{ github.sha }}"
                  done
            - working-directory: .
              name: push the docker images
              run: |
                  docker compose -f docker-compose.dev.yml push api-server frontend queue-consumer documentation
                  for service in api-server frontend queue-consumer documentation; do
                    docker push "rslethz/kleinkram:${service}-${{ steps.version.outputs.version }}-dev.${{ github.sha }}"
                  done
