name: Docker Image CI (GrandTour Datasets)

on:
    push:
        branches: ['dev']

jobs:
    dev-build:
        environment: 'BuildEnv'
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Login to registry
              run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login registry.merrickcampbell.au -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin
            - name: Read app version
              id: version
              run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
            - working-directory: .
              name: Build and push the Docker compose images
              run: docker compose -f docker-compose.dev.yml build --push
              env:
                  BACKEND_URL: ${{ vars.BACKEND_URL_DEV }}
                  GIT_BRANCH: ${{ github.ref_name }}
                  GIT_COMMIT: ${{ github.sha }}
                  S3_ENDPOINT: ${{ vars.S3_ENDPOINT_DEV }}
                  BUILDX_NO_DEFAULT_ATTESTATIONS: 1
            - name: Tag images with traceable dev version
              run: |
                  for service in api-server frontend queue-consumer docs; do
                    docker buildx imagetools create \
                      --tag "registry.merrickcampbell.au/kleinkram:${service}-${{ steps.version.outputs.version }}-dev.${{ github.sha }}" \
                      "registry.merrickcampbell.au/kleinkram:${service}-dev"
                  done
