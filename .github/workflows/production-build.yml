name: Docker Image CI (GrandTour Datasets)

on:
    push:
        branches: ['main']

jobs:
    production-build:
        environment: 'BuildEnv'
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - name: Login to DockerHub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Read app version
              id: version
              run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
            - working-directory: .
              name: Build the Docker compose
              run: docker compose -f docker-compose.prod.yml build
              env:
                  BACKEND_URL: ${{ vars.BACKEND_URL }}
                  GIT_BRANCH: ${{ github.ref_name }}
                  GIT_COMMIT: ${{ github.sha }}
                  S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
            - name: Tag images with immutable app version
              run: |
                  for service in api-server frontend queue-consumer documentation; do
                    docker tag "rslethz/kleinkram:${service}-latest" "rslethz/kleinkram:${service}-${{ steps.version.outputs.version }}"
                  done
            - working-directory: .
              name: push the docker images
              run: |
                  docker compose -f docker-compose.prod.yml push api-server frontend queue-consumer documentation
                  for service in api-server frontend queue-consumer documentation; do
                    docker push "rslethz/kleinkram:${service}-${{ steps.version.outputs.version }}"
                  done
