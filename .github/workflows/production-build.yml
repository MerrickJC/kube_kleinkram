name: Docker Image CI (GrandTour Datasets)

on:
    push:
        branches: ['main']

jobs:
    production-build:
        environment: 'BuildEnv'
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Login to registry
              run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login registry.direct.merrickcampbell.au -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin
            - name: Read app version
              id: version
              run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
            - working-directory: .
              name: Build the Docker compose images
              run: docker compose -f docker-compose.prod.yml build api-server frontend queue-consumer documentation
              env:
                  BACKEND_URL: ${{ vars.BACKEND_URL }}
                  GIT_BRANCH: ${{ github.ref_name }}
                  GIT_COMMIT: ${{ github.sha }}
                  S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
                  BUILDX_NO_DEFAULT_ATTESTATIONS: 1
            - name: Tag images with immutable app version
              run: |
                  for service in api-server frontend queue-consumer docs; do
                    docker tag "registry.direct.merrickcampbell.au/kleinkram:${service}-latest" "registry.direct.merrickcampbell.au/kleinkram:${service}-${{ steps.version.outputs.version }}"
                  done
            - working-directory: .
              name: push the docker images
              run: |
                  for service in api-server frontend queue-consumer docs; do
                    docker push "registry.direct.merrickcampbell.au/kleinkram:${service}-latest"
                    docker push "registry.direct.merrickcampbell.au/kleinkram:${service}-${{ steps.version.outputs.version }}"
                  done
