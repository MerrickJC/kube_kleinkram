name: Build Sample Actions

on:
    workflow_dispatch:
        inputs:
            kleinkram_version:
                description: 'Kleinkram version to install'
                required: false
                default: ''
    workflow_run:
        workflows: ['Update PyPI']
        types:
            - completed
    push:
        paths:
            - 'examples/kleinkram-actions/**'

permissions:
    id-token: write # required so the workflow can request an OIDC token for the registry
    contents: read

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        strategy:
            matrix:
                action:
                    [
                        validate-data,
                        extract-metadata,
                        convert-formats,
                        python-template,
                        gpu-example,
                    ]
                type: [dev, prod]

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Get OIDC token for the registry
              id: oidc
              uses: actions/github-script@v7
              with:
                  script: |
                      const token = await core.getIDToken('zot')
                      core.setOutput('token', token)

            - name: Login to registry
              run: echo "${{ steps.oidc.outputs.token }}" | docker login registry.merrickcampbell.au -u oidc --password-stdin

            - name: Determine Tag
              id: tag
              run: |
                  if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
                    if [ "${{ matrix.type }}" == "prod" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
                      echo "tag=latest" >> $GITHUB_OUTPUT
                    else
                      echo "tag=dev" >> $GITHUB_OUTPUT
                    fi
                    echo "kleinkram_version=${{ inputs.kleinkram_version }}" >> $GITHUB_OUTPUT
                  elif [ "${{ matrix.type }}" == "dev" ]; then
                    echo "tag=dev" >> $GITHUB_OUTPUT
                    echo "kleinkram_version=" >> $GITHUB_OUTPUT # Installs latest from PyPI which is updated by Update PyPI workflow
                  else
                    echo "tag=latest" >> $GITHUB_OUTPUT
                    echo "kleinkram_version=" >> $GITHUB_OUTPUT # Installs latest from PyPI
                  fi

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: examples/kleinkram-actions/${{ matrix.action }}
                  push: true
                  tags: registry.merrickcampbell.au/action:${{ matrix.action }}-${{ steps.tag.outputs.tag }}
                  build-args: |
                      KLEINKRAM_VERSION=${{ steps.tag.outputs.kleinkram_version }}
