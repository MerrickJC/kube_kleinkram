{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: kleinkram-redis
  namespace: {{ .Values.namespaces.app }}
  labels:
    {{- include "kleinkram.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  clusterIP: None
  selector:
    {{- include "kleinkram.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  ports:
    - port: 6379
{{- end }}
