# A ClusterRole (so it can be reused/versioned once), bound to two
# namespaced RoleBindings: kleinkram-action-operator (queue-consumer) and
# kleinkram-action-dispatcher (the locality dispatcher, which also builds
# and submits Workflows itself once it decides on a node). Provides
# a least-privilege grant onto exactly the objects either needs
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kleinkram-action-operator
  labels:
    {{- include "kleinkram.labels" . | nindent 4 }}
rules:
  - apiGroups: ['argoproj.io']
    resources: ['workflows']
    verbs: ['create', 'get', 'list', 'watch', 'delete', 'patch']
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['']
    resources: ['secrets']
    verbs: ['create', 'get', 'delete']
