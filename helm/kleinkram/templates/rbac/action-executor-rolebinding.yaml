apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kleinkram-action-executor
  namespace: {{ .Values.namespaces.actions }}
  labels:
    {{- include "kleinkram.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.actions.executorServiceAccountName }}
    namespace: {{ .Values.namespaces.actions }}
roleRef:
  kind: Role
  name: kleinkram-action-executor
  apiGroup: rbac.authorization.k8s.io
