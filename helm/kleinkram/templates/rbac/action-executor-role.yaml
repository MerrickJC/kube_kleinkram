# Least-privilege grant for Argo's argoexec init/wait containers, matching
# the "executor" role from Argo's own install manifests: enough to report
# step results and stream logs, nothing that lets it reach outside its own
# pod or namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kleinkram-action-executor
  namespace: {{ .Values.namespaces.actions }}
  labels:
    {{- include "kleinkram.labels" . | nindent 4 }}
rules:
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['get', 'watch', 'patch']
  - apiGroups: ['']
    resources: ['pods/log']
    verbs: ['get', 'watch']
  - apiGroups: ['argoproj.io']
    resources: ['workflowtaskresults']
    verbs: ['create', 'patch']
