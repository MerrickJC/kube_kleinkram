{{- if .Values.locality.enabled }}
# Needed for locality-aware node affinity
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kleinkram-action-operator-nodes
  labels:
    {{- include "kleinkram.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.queueConsumer.serviceAccountName }}
    namespace: {{ .Values.namespaces.app }}
roleRef:
  kind: ClusterRole
  name: kleinkram-action-operator-nodes
  apiGroup: rbac.authorization.k8s.io
{{- end }}
