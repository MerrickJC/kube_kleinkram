# Identity for Argo's own init/wait (argoexec) containers inside Action
# pods. Argo mounts this SA's token only into its system containers when the
# Workflow sets spec.executor.serviceAccountName
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.actions.executorServiceAccountName }}
  namespace: {{ .Values.namespaces.actions }}
  labels:
    {{- include "kleinkram.labels" . | nindent 4 }}
