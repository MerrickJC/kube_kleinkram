# Argo mounts spec.executor.serviceAccountName's token from a Secret named
# "<sa>.service-account-token". K8s 1.24+ no longer auto-creates it, so we
# create it explicitly. The control plane fills in token/ca.crt/namespace
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.actions.executorServiceAccountName }}.service-account-token
  namespace: {{ .Values.namespaces.actions }}
  labels:
    {{- include "kleinkram.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ .Values.actions.executorServiceAccountName }}
type: kubernetes.io/service-account-token
