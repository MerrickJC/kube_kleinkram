# Identity for the Action containers Argo runs. Deliberately has no
# RBAC bindings. The ServiceAccount only exists to carry imagePullSecrets
# for Action images pulled from a private registry.
# automountServiceAccountToken is disabled so a Kubernetes API
# token is never mounted into a user-supplied container
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.actions.serviceAccountName }}
  namespace: {{ .Values.namespaces.actions }}
  labels:
    {{- include "kleinkram.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- if .Values.actions.imagePullSecrets }}
{{- include "kleinkram.imagePullSecrets" .Values.actions.imagePullSecrets | nindent 0 }}
{{- end }}
