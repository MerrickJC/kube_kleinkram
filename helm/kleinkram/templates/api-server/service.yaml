apiVersion: v1
kind: Service
metadata:
  name: kleinkram-api-server
  namespace: {{ .Values.namespaces.app }}
  labels:
    {{- include "kleinkram.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-server
spec:
  selector:
    {{- include "kleinkram.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api-server
  ports:
    - port: {{ .Values.apiServer.service.port }}
      targetPort: {{ .Values.apiServer.port }}
