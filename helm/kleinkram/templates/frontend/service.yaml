apiVersion: v1
kind: Service
metadata:
  name: kleinkram-frontend
  namespace: {{ .Values.namespaces.app }}
  labels:
    {{- include "kleinkram.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector:
    {{- include "kleinkram.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.containerPort }}
