apiVersion: v1
kind: ConfigMap
metadata:
  name: kleinkram-config
  namespace: {{ .Values.namespaces.app }}
  labels:
    {{- include "kleinkram.labels" . | nindent 4 }}
data:
  FRONTEND_URL: {{ .Values.config.frontendUrl | quote }}
  DOCS_URL: {{ .Values.config.docsUrl | quote }}
  BACKEND_URL: {{ .Values.config.backendUrl | quote }}
  S3_ENDPOINT: {{ .Values.config.s3Endpoint | quote }}
  S3_DATA_BUCKET_NAME: {{ .Values.config.s3DataBucketName | quote }}
  S3_DB_BUCKET_NAME: {{ .Values.config.s3DbBucketName | quote }}
  S3_ARTIFACTS_BUCKET_NAME: {{ .Values.config.s3ArtifactsBucketName | quote }}
  DB_HOST: {{ .Values.config.dbHost | quote }}
  DB_PORT: {{ .Values.config.dbPort | quote }}
  DB_DATABASE: {{ .Values.config.dbDatabase | quote }}
  REDIS_HOST: {{ if .Values.redis.enabled }}kleinkram-redis{{ else }}{{ .Values.config.redisHost }}{{ end }}
  # The bundled Redis always listens on the standard 6379 port, so force it here the same way
  # REDIS_HOST is forced above. config.redisPort only applies when pointing at an externally-managed
  # Redis (redis.enabled: false)
  REDIS_PORT: {{ if .Values.redis.enabled }}'6379'{{ else }}{{ .Values.config.redisPort | quote }}{{ end }}
  VITE_DOCKER_HUB_NAMESPACE: {{ .Values.config.dockerHubNamespace | quote }}
  DEV: 'false'
  SEED: 'false'
  DEVBUILD: 'false'
  VITE_USE_FAKE_OAUTH_FOR_DEVELOPMENT: {{ .Values.config.vitePublicOauthFake | quote }}
  GOOGLE_KEY_FILE: /app/secrets/google-service-account.json
  {{- if .Values.config.oidcIssuerUrl }}
  OIDC_ISSUER_URL: {{ .Values.config.oidcIssuerUrl | quote }}
  OIDC_DISPLAY_NAME: {{ .Values.config.oidcDisplayName | quote }}
  OIDC_SCOPE: {{ .Values.config.oidcScope | quote }}
  {{- end }}
  # Kubernetes/Argo/Kueue integration. Defaults match the code's fallbacks.
  # Set explicitly here for operability/clarity.
  KUBE_NAMESPACE_ACTIONS: {{ .Values.queueConsumer.actionsNamespace | quote }}
  KUEUE_LOCAL_QUEUE: {{ .Values.queueConsumer.kueueLocalQueue | quote }}
  ARGO_ARTIFACT_REPOSITORY_CONFIGMAP: {{ .Values.queueConsumer.argoArtifactRepositoryConfigMap | quote }}
  ACTION_POD_SERVICE_ACCOUNT: {{ .Values.actions.serviceAccountName | quote }}
  ACTION_EXECUTOR_SERVICE_ACCOUNT: {{ .Values.actions.executorServiceAccountName | quote }}
  {{- if .Values.observability.prometheusUrl }}
  PROMETHEUS_URL: {{ .Values.observability.prometheusUrl | quote }}
  {{- end }}
  {{- if .Values.config.s3EndpointInternal }}
  S3_ENDPOINT_INTERNAL: {{ .Values.config.s3EndpointInternal | quote }}
  {{- end }}
