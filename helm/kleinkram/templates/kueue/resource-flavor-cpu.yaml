apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: {{ .Values.kueue.resourceFlavors.cpu.name }}
  labels:
    {{- include "kleinkram.labels" . | nindent 4 }}
spec:
  {{- if .Values.kueue.resourceFlavors.cpu.nodeSelector }}
  nodeLabels:
    {{- toYaml .Values.kueue.resourceFlavors.cpu.nodeSelector | nindent 4 }}
  {{- end }}
