# PLACEHOLDER nodeSelector/tolerations -- see values.yaml's kueue.resourceFlavors.gpu
# comment. Must match the cluster's real GPU node pool labels/taints; the
# NVIDIA device plugin DaemonSet must already be running there (K3s does not
# install it, and this chart does not either).
apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: {{ .Values.kueue.resourceFlavors.gpu.name }}
  labels:
    {{- include "kleinkram.labels" . | nindent 4 }}
spec:
  {{- if .Values.kueue.resourceFlavors.gpu.nodeSelector }}
  nodeLabels:
    {{- toYaml .Values.kueue.resourceFlavors.gpu.nodeSelector | nindent 4 }}
  {{- end }}
  {{- if .Values.kueue.resourceFlavors.gpu.tolerations }}
  tolerations:
    {{- toYaml .Values.kueue.resourceFlavors.gpu.tolerations | nindent 4 }}
  {{- end }}
