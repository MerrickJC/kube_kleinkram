apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: {{ .Values.kueue.clusterQueueName }}
  labels:
    {{- include "kleinkram.labels" . | nindent 4 }}
spec:
  namespaceSelector: {}
  resourceGroups:
    - coveredResources: ['cpu', 'memory']
      flavors:
        - name: {{ .Values.kueue.resourceFlavors.cpu.name }}
          resources:
            - name: 'cpu'
              nominalQuota: {{ .Values.kueue.quota.cpu.cpu | quote }}
            - name: 'memory'
              nominalQuota: {{ .Values.kueue.quota.cpu.memory | quote }}
    - coveredResources: ['nvidia.com/gpu']
      flavors:
        - name: {{ .Values.kueue.resourceFlavors.gpu.name }}
          resources:
            - name: 'nvidia.com/gpu'
              nominalQuota: {{ .Values.kueue.quota.gpu.nvidiaGpu | quote }}
