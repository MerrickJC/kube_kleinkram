apiVersion: v1
kind: Service
metadata:
  name: kleinkram-documentation
  namespace: {{ .Values.namespaces.app }}
  labels:
    {{- include "kleinkram.labels" . | nindent 4 }}
    app.kubernetes.io/component: documentation
spec:
  selector:
    {{- include "kleinkram.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: documentation
  ports:
    - port: {{ .Values.documentation.service.port }}
      targetPort: {{ .Values.documentation.containerPort }}
