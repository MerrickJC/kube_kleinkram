    app.kubernetes.io/managed-by: Helm

---
# Source: kleinkram/templates/namespaces.yaml
apiVersion: v1
kind: Namespace
metadata:
  # Separate from the app namespace so RBAC, NetworkPolicy, and the image
  # allow-list policy can scope tightly to only user-supplied Action
  # containers, never the trusted app services.
  name: kleinkram-actions
  labels:
    app.kubernetes.io/name: kleinkram
    app.kubernetes.io/instance: kleinkram
    app.kubernetes.io/managed-by: Helm

---
# Source: kleinkram/templates/network-policy/action-pods-egress.yaml
# Default-deny egress from Action pods except DNS, the api-server Service,
# and the SeaweedFS S3 endpoint
#
# LIMITATION: standard NetworkPolicy can't match by external hostname, only
# label/namespace selectors or CIDRs. `networkPolicy.seaweedfsCidr` assumes
# SeaweedFS is reachable via a cluster-internal Service/CIDR range. If
# SeaweedFS is external to the cluster, it will not be reachable as it is 
# currently configured, so it will need to be adjusted
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kleinkram-action-egress
  namespace: kleinkram-actions
  labels:
    app.kubernetes.io/name: kleinkram
    app.kubernetes.io/instance: kleinkram
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector: {}
  policyTypes: ['Egress']
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kleinkram
          podSelector:
            matchLabels:
              app.kubernetes.io/component: api-server
      ports:
        - { protocol: TCP, port: 3000 }
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - { protocol: TCP, port: 9000 }

