---
# Source: kleinkram/templates/rbac/action-pod-serviceaccount.yaml
# Identity for the Action containers Argo runs. Deliberately has no
# RBAC bindings. The ServiceAccount only exists to carry imagePullSecrets
# for Action images pulled from a private registry.
# automountServiceAccountToken is disabled so a Kubernetes API
# token is never mounted into a user-supplied container
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kleinkram-action-pod
  namespace: kleinkram-actions
  labels:
    app.kubernetes.io/name: kleinkram
    app.kubernetes.io/instance: kleinkram
    app.kubernetes.io/managed-by: Helm
automountServiceAccountToken: false

---
# Source: kleinkram/templates/argo/artifact-repository-configmap.yaml
# Points Argo's built-in artifact upload at the already-installed SeaweedFS
# bucket which Kleinkram writes artifacts to
apiVersion: v1
kind: ConfigMap
metadata:
  name: kleinkram-artifact-repository
  namespace: kleinkram-actions
  labels:
    app.kubernetes.io/name: kleinkram
    app.kubernetes.io/instance: kleinkram
    app.kubernetes.io/managed-by: Helm
data:
  artifactRepository: |
    s3:
      bucket: action-artifacts
      endpoint: "seaweedfs.default.svc:9000"
      insecure: true
      accessKeySecret:
        name: kleinkram-artifact-repository-credentials
        key: accessKey
      secretKeySecret:
        name: kleinkram-artifact-repository-credentials
        key: secretKey

---
# Source: kleinkram/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: kleinkram-config
  namespace: kleinkram
  labels:
    app.kubernetes.io/name: kleinkram
    app.kubernetes.io/instance: kleinkram
    app.kubernetes.io/managed-by: Helm
data:
  FRONTEND_URL: "https://kleinkram.example.com"
  DOCS_URL: "https://docs.kleinkram.example.com"
  BACKEND_URL: "https://api.kleinkram.example.com"
  S3_ENDPOINT: "http://seaweedfs.default.svc:9000"
  S3_DATA_BUCKET_NAME: "kleinkram-data"
  S3_DB_BUCKET_NAME: "kleinkram-dbbackup"
  S3_ARTIFACTS_BUCKET_NAME: "action-artifacts"
  DB_HOST: "postgres.default.svc"
  DB_PORT: "5432"
  DB_DATABASE: "kleinkram"
  REDIS_HOST: kleinkram-redis
  REDIS_PORT: "6379"
  VITE_DOCKER_HUB_NAMESPACE: "rslethz"
  DEV: 'false'
  SEED: 'false'
  DEVBUILD: 'false'
  GOOGLE_KEY_FILE: /app/secrets/google-service-account.json
  # Kubernetes/Argo/Kueue integration. Defaults match the code's fallbacks.
  # Set explicitly here for operability/clarity.
  KUBE_NAMESPACE_ACTIONS: "kleinkram-actions"
  KUEUE_LOCAL_QUEUE: "kleinkram-actions"
  ARGO_ARTIFACT_REPOSITORY_CONFIGMAP: "kleinkram-artifact-repository"
  ACTION_POD_SERVICE_ACCOUNT: "kleinkram-action-pod"
  PROMETHEUS_URL: "http://prometheus.observability.svc:9090"

---
# Source: kleinkram/templates/rbac/action-operator-clusterrole.yaml
# A ClusterRole (so it can be reused/versioned once), which is only ever
# bound to the namespaced kleinkram-action-operator RoleBinding. Provides
# a least-privilege grant onto exactly the objects the Action Operator needs
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kleinkram-action-operator
  labels:
    app.kubernetes.io/name: kleinkram
    app.kubernetes.io/instance: kleinkram
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: ['argoproj.io']
    resources: ['workflows']
    verbs: ['create', 'get', 'list', 'watch', 'delete', 'patch']
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['']
    resources: ['secrets']
    verbs: ['create', 'get', 'delete']

---
# Source: kleinkram/templates/rbac/action-operator-rolebinding.yaml
# This scopes the reusable kleinkram-action-operator ClusterRole's permissions to
# just the kleinkram-actions namespace, for the ServiceAccount that lives in
# the kleinkram (app) namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kleinkram-action-operator
  namespace: kleinkram-actions
  labels:
    app.kubernetes.io/name: kleinkram
    app.kubernetes.io/instance: kleinkram
    app.kubernetes.io/managed-by: Helm
subjects:
  - kind: ServiceAccount
    name: kleinkram-action-operator
    namespace: kleinkram
roleRef:
  kind: ClusterRole
  name: kleinkram-action-operator
  apiGroup: rbac.authorization.k8s.io

