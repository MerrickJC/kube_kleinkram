kind: ResourceFlavor
metadata:
  name: gpu-default
  labels:
    app.kubernetes.io/name: kleinkram
    app.kubernetes.io/instance: kleinkram
    app.kubernetes.io/managed-by: Helm
spec:
  nodeLabels:
    gpu: "true"
  tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists

---
# Source: kleinkram/templates/kueue/workload-priority-class.yaml
# NOTE: nothing in workflow-dispatch.service.ts currently sets a
# priorityClassName on submitted Workflows, these are here for
# future extension
apiVersion: kueue.x-k8s.io/v1beta1
kind: WorkloadPriorityClass
metadata:
  name: kleinkram-interactive
  labels:
    app.kubernetes.io/name: kleinkram
    app.kubernetes.io/instance: kleinkram
    app.kubernetes.io/managed-by: Helm
value: 1000
description: Manual/WEBHOOK-triggered Actions -- a human is waiting on this.

---
# Source: kleinkram/templates/kueue/workload-priority-class.yaml
apiVersion: kueue.x-k8s.io/v1beta1
kind: WorkloadPriorityClass
metadata:
  name: kleinkram-scheduled
  labels:
    app.kubernetes.io/name: kleinkram
    app.kubernetes.io/instance: kleinkram
    app.kubernetes.io/managed-by: Helm
value: 100
description: TIME/FILE-triggered Actions -- background/batch work.
---
# Source: kleinkram/templates/db-migrate/job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: kleinkram-db-migrate
  namespace: kleinkram
  labels:
    app.kubernetes.io/name: kleinkram
    app.kubernetes.io/instance: kleinkram
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: db-migrate
  annotations:
    # Runs before the api-server/queue-consumer Deployments are created or
    # updated. before-hook-creation clears out a stuck Job from a previous
    # (failed) release so this hook doesn't collide with it on retry.
    'helm.sh/hook': pre-install,pre-upgrade
    'helm.sh/hook-weight': '0'
    'helm.sh/hook-delete-policy': before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kleinkram
        app.kubernetes.io/instance: kleinkram
        app.kubernetes.io/component: db-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: db-migrate
          image: registry.direct.merrickcampbell.au/kleinkram:migrator-1.0.4
          imagePullPolicy: IfNotPresent
          env:
            # Names match backend/migration/prod/production-datasource.config.ts,
            # which is the same TypeORM CLI config used for manual migrations
            # (see docs/development/migrations/migrations.md)
            - name: prod_dbhost
              value: "postgres.default.svc"
            - name: prod_port
              value: "5432"
            - name: prod_dbname
              value: "kleinkram"
            - name: prod_ssl
              value: "false"
            - name: prod_dbuser
              valueFrom: { secretKeyRef: { name: kleinkram-db-credentials, key: DB_USER } }
            - name: prod_dbpassword
              valueFrom: { secretKeyRef: { name: kleinkram-db-credentials, key: DB_PASSWORD } }
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi

