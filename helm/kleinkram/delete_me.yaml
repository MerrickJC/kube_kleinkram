# Source: kleinkram/templates/api-server/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kleinkram-api-server
  namespace: kleinkram
  labels:
    app.kubernetes.io/name: kleinkram
    app.kubernetes.io/instance: kleinkram
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: api-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kleinkram
      app.kubernetes.io/instance: kleinkram
      app.kubernetes.io/component: api-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kleinkram
        app.kubernetes.io/instance: kleinkram
        app.kubernetes.io/component: api-server
    spec:
      containers:
        - name: api-server
          image: registry.direct.merrickcampbell.au/kleinkram:api-server-1.0.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: kleinkram-config }
          env:
            - name: SERVER_PORT
              value: "3000"
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: kleinkram-db-credentials, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: kleinkram-db-credentials, key: DB_PASSWORD } }
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: kleinkram-s3-credentials, key: S3_ACCESS_KEY } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: kleinkram-s3-credentials, key: S3_SECRET_KEY } }
            - name: S3_USER
              valueFrom: { secretKeyRef: { name: kleinkram-s3-credentials, key: S3_USER } }
            - name: S3_PASSWORD
              valueFrom: { secretKeyRef: { name: kleinkram-s3-credentials, key: S3_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: kleinkram-jwt-secret, key: JWT_SECRET } }
            - name: GOOGLE_CLIENT_ID
              valueFrom: { secretKeyRef: { name: kleinkram-google-oauth-credentials, key: GOOGLE_CLIENT_ID } }
            - name: GOOGLE_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: kleinkram-google-oauth-credentials, key: GOOGLE_CLIENT_SECRET } }
            - name: GITHUB_CLIENT_ID
              valueFrom: { secretKeyRef: { name: kleinkram-github-oauth-credentials, key: GITHUB_CLIENT_ID } }
            - name: GITHUB_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: kleinkram-github-oauth-credentials, key: GITHUB_CLIENT_SECRET } }
          volumeMounts:
            - name: google-service-account
              mountPath: /app/secrets
              readOnly: true
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
      volumes:
        - name: google-service-account
          secret:
            secretName: kleinkram-google-service-account
            items:
              - key: google-service-account.json
                path: google-service-account.json

