# Kleinkram Helm chart values
#
# This chart assumes the following are ALREADY INSTALLED in the target
# cluster and does NOT configure them:
#   - Kubernetes (K3s)
#   - Kueue (controller + CRDs) - this chart creates Kleinkram-specific
#     ResourceFlavor/ClusterQueue/LocalQueue objects on top of Kueue
#   - Argo Workflows (workflow-controller + Argo Server) - this chart only
#     configures the S3 artifact repository it reads from
#   - Postgres and SeaweedFS, with reasonable configurations
#
# Optionally, you can also install a policy engine (Kyverno or Gatekeeper)
# for the image allow-list under `policy:` below. This is not deployed by
# this chart

namespaces:
  app: kleinkram
  actions: kleinkram-actions

# Annotations merged onto every Deployment this chart manages (and their Pod
# templates). Per-workload `annotations`/`podAnnotations` below take
# precedence over these on key collisions
commonAnnotations: {}

image:
  registry: registry.direct.merrickcampbell.au
  repository: kleinkram
  # Left blank this uses the chart's `appVersion` by default
  # Set explicitly to one of the following.
  # Immutable tags are:
  #   prod  '-{package.json version}'
  #   dev   '-{version}-dev.{sha}'
  # If using immutable tags, set 'pullPolicy: IfNotPresent'
  # Mutable tags are:
  #   prod  '-latest'
  #   dev   '-dev'
  # If using mutable tags, set 'pullPolicy: Always'
  tag: ''
  pullPolicy: IfNotPresent
  # Names of pre-existing Secrets in the `namespaces.app` namespace, for
  # pulling from a private registry (e.g. if `registry`/`repository` above
  # point at your images instead of the upstream `docker.io/rslethz/kleinkram`).
  # registry.direct.merrickcampbell.au is our own Zot registry; whether a pullSecret
  # is needed here depends on whether it allows anonymous pulls - check the
  # registry's pull auth config and add one if required
  pullSecrets: []

apiServer:
  replicaCount: 1
  port: 3000
  service:
    port: 3000
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: '1', memory: 1Gi }
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  probePath: /api/health
  # Extra annotations on the Deployment object itself, merged with commonAnnotations
  annotations: {}
  # Extra annotations on the Pod template (spec.template.metadata.annotations)
  podAnnotations: {}

# Runs `typeorm migration:run` as a Helm pre-install/pre-upgrade hook Job,
# using the `migrator` image built from docker/backend.Dockerfile's
# `migrator` stage. Disable if you'd rather apply migrations manually. 
# More details in docs/development/migrations/migrations.md
migration:
  enabled: true
  # Set to 'true' if your Postgres requires ssl
  ssl: 'false'
  backoffLimit: 2
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

# Database dumps authenticates as a separate, minimally-privileged Postgres role
# rather than the api-server's own full-access DB user
dbDump:
  enabled: true
  schedule: '0 */2 * * *'
  backoffLimit: 2
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

frontend:
  replicaCount: 1
  containerPort: 80
  service:
    port: 80
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  # Extra annotations on the Deployment object itself, merged with commonAnnotations
  annotations: {}
  # Extra annotations on the Pod template (spec.template.metadata.annotations)
  podAnnotations: {}

documentation:
  replicaCount: 1
  containerPort: 80
  service:
    port: 80
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 100m, memory: 128Mi }
  # Extra annotations on the Deployment object itself, merged with commonAnnotations
  annotations: {}
  # Extra annotations on the Pod template (spec.template.metadata.annotations)
  podAnnotations: {}

# uses the kleinkram-action-operator ServiceAccount with namespaced RBAC
# onto Workflow/Pod/Secret objects
queueConsumer:
  replicaCount: 1
  port: 3000
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: '1', memory: 1Gi }
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  serviceAccountName: kleinkram-action-operator
  probePath: /health
  # Defaults below match the fallback values already in the code
  actionsNamespace: kleinkram-actions
  kueueLocalQueue: kleinkram-actions
  argoArtifactRepositoryConfigMap: kleinkram-artifact-repository
  # Extra annotations on the Deployment object itself, merged with commonAnnotations
  annotations: {}
  # Extra annotations on the Pod template (spec.template.metadata.annotations)
  podAnnotations: {}

# This is the identity the Action containers themselves run as and has NO RBAC bindings. 
# It mainly carries imagePullSecrets for Action images pulled from a private registry
actions:
  serviceAccountName: kleinkram-action-pod
  # Separate from image.pullSecrets since Action images may be in a
  # different registry than this app's own images
  imagePullSecrets: []
  # Identity Argo's own init/wait (argoexec) containers run as. Kept separate
  # from serviceAccountName above: Argo mounts this one only into its own
  # system containers (via Workflow spec.executor.serviceAccountName), never
  # into the user-supplied main container, so Action images still never see
  # a Kubernetes API token
  executorServiceAccountName: kleinkram-action-executor

# set redis.enabled=false to point at an externally-managed Redis instead
# (you would then configure redis via config.redisHost/redisPort in the
# config object below)
redis:
  enabled: true
  image: redis:latest
  storage: 1Gi
  storageClassName: local-path
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }

config:
  frontendUrl: 'https://kleinkram.example.com'
  docsUrl: 'https://docs.kleinkram.example.com'
  backendUrl: 'https://api.kleinkram.example.com'
  s3Endpoint: 'http://seaweedfs.default.svc:9000'
  s3DataBucketName: kleinkram-data
  s3DbBucketName: kleinkram-dbbackup
  s3ArtifactsBucketName: action-artifacts
  dbHost: postgres.default.svc
  dbPort: 5432
  dbDatabase: kleinkram
  redisHost: kleinkram-redis
  redisPort: 6379
  dockerHubNamespace: rslethz
  vitePublicOauthFake: 'false'
  # Cluster-internal S3 endpoint used by the backend's own S3/STS calls and by
  # Argo's artifact repository config for Action artifact uploads (as opposed
  # to `s3Endpoint`, which is used to build presigned URLs handed to
  # browsers/the CLI and so must stay externally reachable). Defaults to a
  # bare `seaweedfs` hostname. Set this if `s3Endpoint` differs from the
  # in-cluster Service address
  s3EndpointInternal: ''
  # Generic OpenID Connect login provider (e.g. Dex, Keycloak, Okta, Auth0).
  # Leave blank to disable. secretNames.oidcOauth must be set with 
  # OIDC_CLIENT_ID/OIDC_CLIENT_SECRET for the "oidc" login button to appear.
  # Only the issuer needs to be set, its `.well-known/openid-configuration`
  # document is used to discover the authorization/token/userinfo endpoints.
  oidcIssuerUrl: ''
  # Label shown on the frontend's OIDC login button, e.g. 'Dex' or 'Company SSO'
  oidcDisplayName: 'OIDC'
  # Space-separated OAuth2 scopes requested from the OIDC provider. 'openid'
  # is always requested even if omitted here.
  oidcScope: 'openid profile email'

# this chart references Secret names in its Deployments, it does not create
# the Secret objects or manage their contents
secretNames:
  # secrets are split to reduce the number of values that need to rotate if a secret is compromised
  #
  # DB_USER, DB_PASSWORD
  db: kleinkram-db-credentials
  # DB_USER, DB_PASSWORD for the db-dump CronJob. Should be a read-only Postgres user
  dbDump: kleinkram-db-dump-credentials
  # S3_ACCESS_KEY, S3_SECRET_KEY, S3_USER, S3_PASSWORD
  #
  # The backend vends per-upload scoped credentials via STS AssumeRole.
  # If the storage backend is JuiceFS's S3 gateway, this MUST be a regular
  # gateway user (created via `mc admin user add` against the gateway, with
  # a policy granting it S3 access to the configured buckets). JuiceFS's
  # AssumeRole API explicitly rejects the gateway's bootstrap/superuser
  # (env-var) credentials, so pointing this at the superuser will make every
  # upload fail at the AssumeRole call
  s3: kleinkram-s3-credentials
  # JWT_SECRET
  jwt: kleinkram-jwt-secret
  # GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
  googleOauth: kleinkram-google-oauth-credentials
  # GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET
  githubOauth: kleinkram-github-oauth-credentials
  # OIDC_CLIENT_ID, OIDC_CLIENT_SECRET. Leave blank to disable the generic
  # OIDC login provider entirely
  oidcOauth: ''
  # Must contain the service account JSON (in the key named in
  # secretKeys.googleServiceAccount)
  googleServiceAccount: kleinkram-google-service-account

# Keys inside the Secrets named above. Only change these if your existing
# Secret objects use different key names than the ones below - the app itself
# doesn't care what the Secret's keys are called, only what's in values here.
secretKeys:
  db:
    user: DB_USER
    password: DB_PASSWORD
  dbDump:
    user: DB_USER
    password: DB_PASSWORD
  s3:
    accessKey: S3_ACCESS_KEY
    secretKey: S3_SECRET_KEY
    user: S3_USER
    password: S3_PASSWORD
  jwt:
    secret: JWT_SECRET
  googleOauth:
    clientId: GOOGLE_CLIENT_ID
    clientSecret: GOOGLE_CLIENT_SECRET
  githubOauth:
    clientId: GITHUB_CLIENT_ID
    clientSecret: GITHUB_CLIENT_SECRET
  oidcOauth:
    clientId: OIDC_CLIENT_ID
    clientSecret: OIDC_CLIENT_SECRET
  # Key holding the service account JSON blob
  googleServiceAccount: google-service-account.json

# Generic networking.k8s.io/v1 Ingress. Disabled by default. If enabled,
# set `className` to match the ingress controller or leave blank to use the
# cluster's default IngressClass (if one exists). Enable ingress.tls only
# if a tls certificate is stored in the named secret
ingress:
  enabled: false
  className: ''
  annotations: {}
  frontendHost: kleinkram.example.com
  apiHost: api.kleinkram.example.com
  docsHost: docs.kleinkram.example.com
  tls:
    enabled: false
    secretName: kleinkram-tls

kueue:
  clusterQueueName: kleinkram-cluster-queue
  localQueueName: kleinkram-actions
  resourceFlavors:
    cpu:
      name: cpu-default
      # No node selector by default means pods can bind to any node. Adjust as needed
      nodeSelector: {}
      # No tolerations by default. Set these if CPU action pods need to schedule
      # onto tainted nodes (e.g. a dedicated action node pool)
      tolerations: []
    gpu:
      name: gpu-default
      # Must match the node label applied to the GPU node pool, and the NVIDIA device
      # plugin DaemonSet must already be running there. Adjust nodeSelector/tolerations
      # to match
      nodeSelector:
        gpu: 'true'
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
  # sample quotas. These numbers are examples only - replace them with your
  # own cluster's real capacity. Kueue only enforces quota; it has no
  # visibility into per-node fit, so if this is set higher than the cluster
  # can actually run, excess pods go Pending in the scheduler instead of
  # waiting gated in Kueue, and Kueue's waitForPodsReady (see
  # docs/development/kubernetes-deployment.md) never sees them to evict and
  # retry. Size each resource as: sum of node allocatable (not capacity) for
  # the nodes this queue's ResourceFlavor can use, minus DaemonSet requests
  # and other namespaces' pods on those nodes, minus a headroom margin. Do
  # not raise this via a cohort/borrowing beyond what the cluster actually
  # has. Re-measure and update whenever nodes are added or removed.
  quota:
    cpu:
      cpu: '16'
      memory: 64Gi
      # Covers the emptyDir mounted at /out for Action containers (see
      # workflow-dispatch.service.ts). Kueue refuses to admit a pod
      # requesting a resource that isn't in the ClusterQueue's
      # coveredResources, so this must stay in sync with
      # ACTION_OUTPUT_VOLUME_SIZE_LIMIT times expected concurrent actions.
      ephemeralStorage: 500Gi
    gpu:
      nvidiaGpu: '2'
  # Optional flag to create WorkloadPriorityClasses
  priorityClasses:
    enabled: true

# Locality-scheduled S3 cache: required, tiered node-affinity toward
# whichever node's local JuiceFS gateway already caches an Action's mission
# data, with a weighted preference layered on top of every tier's hard
# requirement so that if several of a tier's allowed nodes are free at
# once, the best-ranked one still wins rather than it being arbitrary.
# None of the gateway/cache infrastructure itself is deployed by this
# chart, this only tells the Action Operator which node labels to look for
# and how to widen from the best-ranked node out to the rest of the
# cache-tier pool if it's full. A pod never falls back to scheduling on
# cluster-core nodes outside this pool - every tier (including the final
# one) stays scoped to nodeLabelSelector (+ gpuNodeLabelSelector for GPU
# actions). This requires Kueue's waitForPodsReady to be configured on the
# Kueue installation (not by this chart - see
# docs/development/kubernetes-deployment.md), otherwise a pod stuck on an
# unschedulable tier is never evicted/retried into the next one.
locality:
  enabled: true
  # Must match the label applied to nodes running a node-local JuiceFS
  # gateway with a cache disk
  nodeLabelSelector: 'cache-tier=true'
  # Must match kueue.resourceFlavors.gpu.nodeSelector above, so a GPU
  # action's affinity is only ever pointed at nodes it can actually
  # schedule onto. Keep these two in sync if you change the GPU node label.
  gpuNodeLabelSelector: 'gpu=true'
  # Ascending sizes of the strict, ranked-hostname tiers (top 1, top 2,
  # top 4, ...) an Action run steps through - each capped at the number of
  # eligible nodes actually found - before falling back to a final tier
  # scoped to the whole cache-tier pool via nodeLabelSelector. Higher
  # values/more tiers add resilience if top-ranked nodes are often full, at
  # the cost of diluting cache concentration and a longer worst-case wait
  # before a pod reaches an unconstrained-within-the-pool tier
  tierSizes: '1,2,4'
  # Retry limit for the final tier, so a Kueue waitForPodsReady eviction
  # there (the whole cache-tier pool momentarily full) is retried in place
  # rather than failing the Action
  fallbackRetryLimit: 20

argo:
  artifactRepository:
    configMapName: kleinkram-artifact-repository
    # Not created by this chart (see `secretNames` comment above)
    credentialsSecretName: kleinkram-artifact-repository-credentials
    # Keys inside credentialsSecretName above
    credentialsSecretKeys:
      accessKey: accessKey
      secretKey: secretKey
    key: artifactRepository

policy:
  # Requires Kyverno (or Gatekeeper) to already be installed in the cluster
  kyverno:
    enabled: false
    allowedImageRegistries:
      - 'registry.direct.merrickcampbell.au/action/*'
      - 'ghcr.io/leggedrobotics/*'

# Restricts kleinkram-action egress. Configs modify DNS namespace and whitelist 
# CIDR for seaweedfs
networkPolicy:
  enabled: true
  # NetworkPolicy can't match by hostname. This assumes SeaweedFS is reachable
  # via a cluster-internal Service/CIDR range but if SeaweedFS is external to
  # the cluster, replace this with the correct egress CIDR. This placeholder
  # is an example only
  seaweedfsCidr: 10.0.0.0/8
  # Must match the port in config.s3Endpoint
  seaweedfsPort: 9000
  dnsNamespace: kube-system

# Observability stack is NOT deployed by this chart (see DESIGN.md in this
# directory). Point the values below at the existing deployments
observability:
  # Leave blank to disable (falls back to running without metrics)
  prometheusUrl: 'http://prometheus.observability.svc:9090'

