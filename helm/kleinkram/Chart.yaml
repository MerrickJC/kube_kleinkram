apiVersion: v2
name: kleinkram
description: >
  Kleinkram self-hosted robotics data platform - Kubernetes deployment. Deploys api-server, frontend, documentation, queue-consumer, the locality dispatcher (action-dispatcher), and an in-cluster Redis. Includes binding objects for Argo Workflows but does NOT install Argo Workflows, Postgres, SeaweedFS, or the observability stack (Prometheus/Loki/Tempo/Promtail). Those components are expected to be managed at a cluster level independently of this helm chart (see DESIGN.md for details).
type: application
version: 0.2.2
appVersion: '1.1.8'
